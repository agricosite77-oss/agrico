# Render Infrastructure-as-Code Blueprint for AgriCo
# https://render.com/docs/blueprint-spec

services:
  # ---------------------------------------------------------------------------
  # AgriCo Production Web Application
  # Runs FrankenPHP (PHP 8.4) with embedded Caddy + Python 3 Scientific ML venv
  # ---------------------------------------------------------------------------
  - type: web
    name: agrico-web
    runtime: docker
    plan: free # Change to starter/standard if needed
    region: singapore # Choose closest region: singapore, oregon, frankfurt, ohio
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: APP_NAME
        value: AgriCo
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        value: ""
      - key: DB_URL
        value: ""
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: aws-0-ap-southeast-1.pooler.supabase.com
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        value: postgres.qbgrxnbayyykrycgtbig
      - key: DB_PASSWORD
        value: '/AgriCo"_^(|SD|)'
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: AWS_ENDPOINT
        value: https://qbgrxnbayyykrycgtbig.supabase.co/storage/v1/s3
      - key: AWS_URL
        value: https://qbgrxnbayyykrycgtbig.supabase.co/storage/v1/object/public/agrico-scans
